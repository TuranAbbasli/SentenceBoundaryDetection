name: sbd

services:
  # One-shot: unpacks model/1/checkpoint.zip -> checkpoint.tl, which config.pbtxt
  # loads. *.tl is gitignored, so a fresh clone only carries the zip.
  # Idempotent -- no-ops if checkpoint.tl already exists.
  model-init:
    image: python:3.11-slim
    volumes:
      - ./triton_inference_server/model:/model
    command:
      - python
      - -c
      - |
        import os, pathlib, zipfile
        d = pathlib.Path("/model/1")
        tl = d / "checkpoint.tl"
        if tl.exists():
            print(f"checkpoint.tl already present ({tl.stat().st_size} bytes)")
        else:
            print("extracting checkpoint.zip ...")
            with zipfile.ZipFile(d / "checkpoint.zip") as z:
                z.extractall(d)
            st = d.stat()
            try:  # hand ownership to whoever owns the host directory
                os.chown(tl, st.st_uid, st.st_gid)
            except (PermissionError, OSError):
                pass
            print(f"extracted checkpoint.tl ({tl.stat().st_size} bytes)")

  triton:
    image: nvcr.io/nvidia/tritonserver:25.11-py3
    container_name: triton_sbd_server
    depends_on:
      model-init:
        condition: service_completed_successfully
    ports:
      - "8001:8001"  # gRPC -- only needed for host-side scripts (inference/*.py); the api service uses the internal network
      # - "8000:8000"  # Triton HTTP -- leave closed, the api service owns host 8000
      # - "8002:8002"  # Metrics
    volumes:
      - ./triton_inference_server:/models
    shm_size: '1gb'
    command: >
      tritonserver
      --model-repository=/models
      --model-control-mode=explicit
      --load-model=model
      --cuda-memory-pool-byte-size 0:1073741824
      --pinned-memory-pool-byte-size=268435456
    healthcheck:
      # If this never turns healthy because the image lacks curl, swap for:
      #   test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8001'"]
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v2/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped
    # Uncomment on a GPU host (needs the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all

  api:
    build:
      context: .
    container_name: sbd_api
    depends_on:
      triton:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Service name on the compose network, not localhost -- the API is its own container now.
      - TRITON_URL=triton:8001
      - MODEL_NAME=model
    restart: unless-stopped
